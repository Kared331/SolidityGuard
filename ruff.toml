# Ruff configuration for SolidGuard
# https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 120

# Alembic 迁移为自动生成代码，不参与 lint/format
exclude = ["backend/alembic"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[format]
quote-style = "double"
indent-style = "space"

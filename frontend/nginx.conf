server {
    # 1.12: Listen on 8080 (non-root cannot bind to privileged ports)
    listen 8080;

    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API key injected at runtime via envsubst from $API_KEY environment variable
        proxy_set_header X-API-Key "$API_KEY";

        # SSE support: disable buffering for event streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;

        # 1.24: Enforce upload size limit at proxy level
        client_max_body_size 50m;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
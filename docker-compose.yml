services:
  # --- Reverse proxy for HTTPS (5.22) ----------------------------
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    profiles:
      - https

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SOLIDGUARD_CONFIG=/app/solidguard.json
      - API_KEY=${API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
      - ./reports:/app/reports
      - ./models:/app/models:ro
      - ./solidguard.json:/app/solidguard.json:ro
    depends_on:
      - postgres
      - redis
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A app.celery_app worker -B --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SOLIDGUARD_CONFIG=/app/solidguard.json
      - API_KEY=${API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
      - ./reports:/app/reports
      - ./models:/app/models:ro
      - ./solidguard.json:/app/solidguard.json:ro
    depends_on:
      - postgres
      - redis
    user: "1000:1000"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solidiguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solidiguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "3000:8080"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf.template
    depends_on:
      - api

volumes:
  pgdata:

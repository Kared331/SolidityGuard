services:
  # --- Reverse proxy for HTTPS (5.22) ----------------------------
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    profiles:
      - https

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      # Docker 网络内用服务名覆盖 .env 的 localhost
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - SOLIDGUARD_CONFIG=/app/solidguard.json
    # 启动前自动执行数据库迁移
    command: sh -c "cd /app && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
      - ./reports:/app/reports
      - ./models:/app/models:ro
      - ./solidguard.json:/app/solidguard.json:ro
    depends_on:
      - postgres
      - redis
    user: "1000:1000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - SOLIDGUARD_CONFIG=/app/solidguard.json
    command: celery -A app.celery_app worker -B --loglevel=info
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
      - ./reports:/app/reports
      - ./models:/app/models:ro
      - ./solidguard.json:/app/solidguard.json:ro
    depends_on:
      - postgres
      - redis
    user: "1000:1000"

  postgres:
    image: postgres:15
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "3000:8080"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf.template
    depends_on:
      - api

volumes:
  pgdata:

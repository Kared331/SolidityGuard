[pytest]
testpaths = tests
# P0-1: 默认排除集成测试（需运行中的 Docker 服务栈）；
# 单独运行集成套件: pytest -m integration（命令行 -m 覆盖 addopts）
addopts = --tb=short -v -m "not integration"
asyncio_mode = auto
markers =
    integration: 集成测试（需 docker compose up -d 运行服务栈；服务不可达时自动 SKIP）

[coverage:run]
source = backend/app
omit =
    backend/app/alembic/*
    backend/app/services/templates/*

[coverage:report]
fail_under = 70
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

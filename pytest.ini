[pytest]
testpaths = tests
addopts = --tb=short -v
asyncio_mode = auto

[coverage:run]
source = backend/app
omit =
    backend/app/alembic/*
    backend/app/services/templates/*

[coverage:report]
fail_under = 70
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
